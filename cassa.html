<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
background:#197619;
}

.home{
background:#555;
}

.storico{
background:#005f9e;
}

</style>

</head>


<body>


<h1>💶 CASSA DOLCE VITA</h1>



<div class="box">


<button class="home" onclick="home()">

🏠 HOME

</button>


<button class="storico" onclick="vaiStorico()">

📊 STORICO INCASSI

</button>


</div>



<div id="conti"></div>





<script>


let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



let area=document.getElementById("conti");





function mostra(){


let testo="";



if(ordini.length==0){


testo=

`

<div class="box">

<h2>Nessun conto aperto</h2>

</div>

`;



}else{


ordini.forEach(function(o,index){



testo +=


`

<div class="box">


<h2>🍽️ Tavolo ${o.tavolo || "1"}</h2>


`;



o.prodotti.forEach(function(p){


testo +=

"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";



});



testo +=


`

<br>

💶 Totale: €${o.totale.toFixed(2)}



<button onclick="chiudiConto(${index})">

✅ CHIUDI CONTO

</button>


</div>


`;



});


}



area.innerHTML=testo;


}







function chiudiConto(index){


let storico =

JSON.parse(localStorage.getItem("storico")) || [];



storico.push(ordini[index]);



localStorage.setItem(

"storico",

JSON.stringify(storico)

);



ordini.splice(index,1);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Conto chiuso e salvato ✅");



mostra();


}





function vaiStorico(){


window.location.href="storico.html";


}




function home(){


window.location.href="index.html";


}



mostra();


</script>


</body>

</html>
