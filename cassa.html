<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Cassa</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:40px;
}


.box{
background:#333;
margin:20px;
padding:25px;
border-radius:20px;
font-size:22px;
}


button{
width:100%;
padding:22px;
margin:10px 0;
border:none;
border-radius:20px;
font-size:22px;
font-weight:bold;
color:white;
}


.pagamento{
background:#005f9e;
}


.ordine{
background:#222;
padding:15px;
border-radius:15px;
}


.totale{
color:#4cff4c;
font-size:38px;
}


</style>


</head>


<body>


<h1>💳 CASSA</h1>



<div class="box">


<h2>🧾 Ordini aperti</h2>


<div id="lista" class="ordine">

Nessun ordine

</div>


<br>


<div class="totale">

Totale € <span id="totale">0</span>

</div>


</div>




<div class="box">


<button class="pagamento" onclick="vaiPagamento()">

💳 VAI AL PAGAMENTO

</button>


</div>




<script src="gestione.js"></script>




<script>


let ordini =
prendiOrdini();



let totale=0;


let testo="";



ordini.forEach(ordine=>{


totale += ordine.totale;



testo +=

"🍕 "+ordine.tipo+
"<br>"+

(ordine.tavolo || ordine.cliente || "")+

"<br>€ "+
ordine.totale+

"<br><br>";



});



if(testo==""){

testo="Nessun ordine aperto";

}



document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=
totale.toFixed(2);





function vaiPagamento(){


window.location.href="pagamento.html";


}



</script>



</body>

</html>
