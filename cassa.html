<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin:10px 0;
border:0;
border-radius:15px;
font-size:20px;
font-weight:bold;
color:white;
}

.home{
background:#555;
}

.storico{
background:#006666;
}

.paga{
background:#197619;
}

</style>

</head>


<body>


<h1>💶 CASSA DOLCE VITA</h1>



<div class="box">

<button class="home" onclick="home()">

🏠 HOME

</button>


<button class="storico" onclick="storico()">

📊 STORICO INCASSI

</button>


</div>



<div id="ordini"></div>





<script>


let ordini = JSON.parse(localStorage.getItem("ordini")) || [];


let area = document.getElementById("ordini");




function carica(){


let html="";



if(ordini.length==0){


html=

`

<div class="box">

<h2>Nessun ordine aperto</h2>

</div>

`;



}else{



ordini.forEach(function(o,index){


html +=


`

<div class="box">


<h2>

${o.tipo=="Asporto" ? "🛍️ ASPORTO" : "🍽️ TAVOLO "+o.tavolo}

</h2>



`;



o.prodotti.forEach(function(p){


html +=

p.nome+" €"+p.prezzo+
"<br>";



});



html +=


`

<br>

<b>Totale €${o.totale.toFixed(2)}</b>


<button class="paga" onclick="pagato(${index})">

✅ PAGATO

</button>


</div>

`;



});


}



area.innerHTML=html;


}






function pagato(index){


let storico = JSON.parse(localStorage.getItem("storico")) || [];


storico.push(ordini[index]);


localStorage.setItem("storico",JSON.stringify(storico));


ordini.splice(index,1);


localStorage.setItem("ordini",JSON.stringify(ordini));


carica();


}





function home(){

window.location.href="index.html";

}




function storico(){

window.location.href="storico.html";

}



carica();


</script>


</body>

</html>
