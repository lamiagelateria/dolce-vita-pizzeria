<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Cassa</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:40px;
}


.box{
background:#333;
margin:20px;
padding:25px;
border-radius:20px;
font-size:22px;
}


button{

width:100%;
padding:22px;
margin:10px 0;
border:none;
border-radius:20px;
font-size:23px;
font-weight:bold;
color:white;

}


.contanti{
background:#197619;
}


.bancomat{
background:#005f9e;
}


.stampa{
background:#8a5a00;
}


.chiudi{
background:#8a1616;
}


.totale{

color:#4cff4c;
font-size:38px;

}


</style>

</head>


<body>


<h1>💳 CASSA</h1>



<div class="box">


<h2>🧾 Conto aperto</h2>


<div id="conto">

Nessun ordine

</div>


<br>


<div class="totale">

Totale € <span id="totale">0</span>

</div>


</div>




<div class="box">


<h2>Pagamento</h2>


<button class="contanti">

💶 CONTANTI

</button>


<button class="bancomat">

💳 BANCOMAT

</button>


</div>





<div class="box">


<h2>Scontrino</h2>


<button class="stampa">

🧾 STAMPA SCONTRINO

</button>


<button>

❌ NON STAMPARE

</button>


</div>




<div class="box">


<button class="chiudi" onclick="chiudi()">

✅ CHIUDI CONTO

</button>


</div>



<script src="gestione.js"></script>



<script>


let ordini =
prendiOrdini();



let totale=0;



let testo="";



ordini.forEach((ordine,index)=>{


totale += ordine.totale;


testo +=

"🍕 "+ordine.tipo+
"<br>"+

(ordine.tavolo || ordine.cliente || "")+

"<br>€ "+
ordine.totale+

"<br><br>";



});



if(testo==""){

testo="Nessun ordine aperto";

}



document.getElementById("conto").innerHTML=
testo;


document.getElementById("totale").innerHTML=
totale.toFixed(2);





function chiudi(){


svuotaOrdini();


alert("Conto chiuso ✅");


location.reload();


}


</script>



</body>

</html>
