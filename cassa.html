<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin:8px 0;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
}

.home{
background:#555;
}

.storico{
background:#006666;
}

.stampa{
background:#005f9e;
}

.paga{
background:#197619;
}

</style>

</head>


<body>


<h1>💶 CASSA DOLCE VITA</h1>


<div class="box">


<button class="home" onclick="vaiHome()">

🏠 HOME

</button>



<button class="storico" onclick="vaiStorico()">

📊 STORICO INCASSI

</button>


</div>



<div id="lista"></div>
<script>


let ordini = JSON.parse(localStorage.getItem("ordini")) || [];

let area = document.getElementById("lista");





function mostra(){


let testo="";



if(ordini.length==0){


testo=

`

<div class="box">

<h2>Nessun conto aperto</h2>

</div>

`;



}else{



ordini.forEach(function(o,index){



testo +=


`

<div class="box">


<h2>

${o.tipo=="Asporto" ? "🛍️ ASPORTO" : "🍽️ TAVOLO "+(o.tavolo || "1")}

</h2>



`;



if(o.tipo=="Asporto"){


testo +=

"👤 "+(o.cliente || "Cliente")+
"<br>";



}else{


testo +=

"👥 Persone: "+(o.persone || "1")+
"<br>";



}



testo += "<br>";




o.prodotti.forEach(function(p){


testo +=

"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";



});



testo +=


`

<br>

💶 Totale: €${o.totale.toFixed(2)}



<button class="stampa" onclick="stampa(${index})">

🖨️ STAMPA CONTO

</button>



<button class="paga" onclick="paga(${index})">

✅ PAGATO

</button>


</div>

`;



});



}



area.innerHTML=testo;


}







function paga(index){


let storico = JSON.parse(localStorage.getItem("storico")) || [];



storico.push(ordini[index]);



localStorage.setItem(

"storico",

JSON.stringify(storico)

);



ordini.splice(index,1);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Pagamento completato ✅");


mostra();


}







function stampa(index){


let o=ordini[index];


let testo=

"DOLCE VITA\n\n";



o.prodotti.forEach(function(p){


testo +=

p.nome+
" €"+
p.prezzo+
"\n";



});



testo +=

"\nTotale €"+
o.totale.toFixed(2);



let win=window.open();


win.document.write("<pre>"+testo+"</pre>");


win.print();


}






function vaiHome(){


window.location.href="index.html";


}



function vaiStorico(){


window.location.href="storico.html";


}



mostra();


</script>


</body>

</html>
