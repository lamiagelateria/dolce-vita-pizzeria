<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Dolce Vita</title>

<style>

body{
margin:0;
background:#181818;
font-family:Arial,sans-serif;
color:white;
}

header{
background:#222;
padding:20px;
text-align:center;
font-size:30px;
font-weight:bold;
color:#ffd000;
}

.home{
width:calc(100% - 30px);
margin:15px;
padding:15px;
border:0;
border-radius:15px;
background:#555;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
}

.conto{
background:#2d2d2d;
margin:15px;
padding:20px;
border-radius:20px;
}

.conto h2{
margin:0 0 10px 0;
color:#ffd000;
}

.riga{
display:flex;
justify-content:space-between;
margin:5px 0;
font-size:18px;
}

.totale{
margin-top:15px;
font-size:28px;
font-weight:bold;
color:#44ff44;
}

.metodi{
display:flex;
gap:10px;
margin-top:20px;
}

.metodi button{
flex:1;
padding:15px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:#444;
color:white;
cursor:pointer;
}

.metodi button.attivo{
background:#197619;
}

.display{
margin-top:20px;
background:black;
color:#00ff00;
font-size:40px;
text-align:right;
padding:15px;
border-radius:15px;
}

.tastiera{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
margin-top:20px;
}

.tastiera button{
padding:22px;
font-size:28px;
border:0;
border-radius:15px;
background:#555;
color:white;
cursor:pointer;
}

.incassa{
width:100%;
margin-top:20px;
padding:18px;
border:0;
border-radius:15px;
background:#197619;
font-size:24px;
font-weight:bold;
color:white;
cursor:pointer;
}

.resto{
margin-top:15px;
font-size:22px;
color:#00ff88;
}

</style>

</head>

<body>

<header>
💶 CASSA DOLCE VITA
</header>

<button class="home" onclick="window.location.href='index.html'">
🏠 TORNA ALLA HOME
</button>

<div id="lista"></div>

<script>

let conti = JSON.parse(localStorage.getItem("contiAperti")) || [];

let area = document.getElementById("lista");

let metodoPagamento = "Contanti";
let importoDigitato = "";
function mostra(){

let html="";


if(conti.length===0){

html=`

<div class="conto">

<h2>Nessun conto aperto</h2>

</div>

`;

}else{


conti.forEach(function(o,index){


html+=`

<div class="conto">


<h2>

${o.tipo=="Asporto" ? "🛍️ ASPORTO" : "🍽️ TAVOLO "+o.tavolo}

</h2>


`;



o.prodotti.forEach(function(p){


html+=`

<div class="riga">

<span>${p.nome}</span>

<span>€${Number(p.prezzo).toFixed(2)}</span>

</div>

`;



});



html+=`

<div class="totale">

Totale €${Number(o.totale).toFixed(2)}

</div>


<div class="metodi">


<button onclick="scegliMetodo('Contanti',${index})" class="attivo">

💵 CONTANTI

</button>


<button onclick="scegliMetodo('Carta',${index})">

💳 CARTA

</button>


</div>


<div class="display" id="display${index}">

${importoDigitato || "0"}

</div>


<div class="tastiera">


<button onclick="numero('7',${index})">7</button>

<button onclick="numero('8',${index})">8</button>

<button onclick="numero('9',${index})">9</button>


<button onclick="numero('4',${index})">4</button>

<button onclick="numero('5',${index})">5</button>

<button onclick="numero('6',${index})">6</button>


<button onclick="numero('1',${index})">1</button>

<button onclick="numero('2',${index})">2</button>

<button onclick="numero('3',${index})">3</button>


<button onclick="cancella(${index})">

C

</button>


<button onclick="numero('0',${index})">

0

</button>


<button onclick="numero('.',${index})">

,

</button>


</div>


<div class="resto" id="resto${index}">

Resto: €0.00

</div>


<button class="incassa" onclick="incassa(${index})">

✅ INCASSA

</button>


</div>

`;



});


}


area.innerHTML=html;


}  
function scegliMetodo(metodo,index){

metodoPagamento = metodo;

mostra();

}



function numero(n,index){

if(n=="," ){

n=".";

}


importoDigitato += n;


document.getElementById("display"+index).innerHTML = importoDigitato;


let conto = Number(conti[index].totale);

let pagato = Number(importoDigitato);


let resto = pagato - conto;


if(resto>0){

document.getElementById("resto"+index).innerHTML =
"Resto: €"+resto.toFixed(2);

}else{

document.getElementById("resto"+index).innerHTML =
"Resto: €0.00";

}


}



function cancella(index){

importoDigitato="";

document.getElementById("display"+index).innerHTML="0";

document.getElementById("resto"+index).innerHTML="Resto: €0.00";

}  
function incassa(index){

let conto = conti[index];


let storico = JSON.parse(localStorage.getItem("storico")) || [];


conto.pagamento = metodoPagamento;

conto.data = new Date().toLocaleString("it-IT");


storico.push(conto);



localStorage.setItem(
"storico",
JSON.stringify(storico)
);



conti.splice(index,1);



localStorage.setItem(
"contiAperti",
JSON.stringify(conti)
);



importoDigitato="";


mostra();


alert("Pagamento completato ✅");


}



mostra();


</script>


</body>

</html>
