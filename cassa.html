<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cassa Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
}

.home{
background:#555;
}

.incassa{
background:#197619;
}

input{
width:100%;
padding:15px;
border-radius:10px;
border:0;
font-size:18px;
}

</style>

</head>


<body>


<h1>💶 CASSA DOLCE VITA</h1>


<div class="box">

<button class="home" onclick="home()">

🏠 TORNA ALLA HOME

</button>

</div>


<div id="lista"></div>




<script>


let ordini = JSON.parse(localStorage.getItem("ordini")) || [];


let area = document.getElementById("lista");




function mostra(){


let html="";


if(ordini.length==0){


html=`

<div class="box">

<h2>Nessun conto aperto</h2>

</div>

`;


}else{


ordini.forEach(function(o,index){



html += `

<div class="box">


<h2>

${o.tipo=="Asporto" ? "🛍️ ASPORTO" : "🍽️ TAVOLO "+(o.tavolo || "")}

</h2>

`;



o.prodotti.forEach(function(p){


html +=

p.nome+" €"+p.prezzo+
"<br>";



});



html += `


<br>

<h2>

Totale €${Number(o.totale).toFixed(2)}

</h2>


<input id="soldi${index}" placeholder="💶 Soldi ricevuti">


<button class="incassa" onclick="incassa(${index})">

💰 INCASSA

</button>


</div>


`;



});


}



area.innerHTML=html;


}






function incassa(index){



let ricevuto = Number(

document.getElementById("soldi"+index).value

);



let totale = Number(ordini[index].totale);



if(ricevuto < totale){


alert("Soldi insufficienti");


return;


}



let resto = ricevuto - totale;



alert("Resto da dare: €"+resto.toFixed(2));



let storico = JSON.parse(localStorage.getItem("storico")) || [];


storico.push(ordini[index]);


localStorage.setItem(

"storico",

JSON.stringify(storico)

);



ordini.splice(index,1);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



mostra();


}





function home(){

window.location.href="./index.html";

}




mostra();


</script>


</body>

</html>
