<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Pagamento</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
}

.box{
background:#333;
margin:20px;
padding:25px;
border-radius:20px;
}

button{
width:100%;
padding:20px;
margin:10px 0;
border:0;
border-radius:20px;
font-size:22px;
font-weight:bold;
color:white;
}

.contanti{
background:#197619;
}

.bancomat{
background:#005f9e;
}

.stampa{
background:#8a5a00;
}

.chiudi{
background:#8a1616;
}

</style>

</head>


<body>


<h1>💳 PAGAMENTO</h1>


<div class="box">

<h2>Metodo pagamento</h2>

<button class="contanti" onclick="scegli('Contanti')">
💶 CONTANTI
</button>


<button class="bancomat" onclick="scegli('Bancomat')">
💳 BANCOMAT
</button>

</div>




<div class="box">

<h2>Scontrino</h2>

<button class="stampa" onclick="scontrino('SI')">
🧾 STAMPA SCONTRINO
</button>


<button onclick="scontrino('NO')">
❌ NON STAMPARE
</button>


</div>




<div class="box">

<button class="chiudi" onclick="chiudiConto()">
✅ CHIUDI CONTO
</button>

</div>




<script src="tavoli.js"></script>


<script>


let pagamento="";

let stampa="";



function scegli(tipo){

pagamento=tipo;

alert("Pagamento: "+tipo);

}




function scontrino(tipo){

stampa=tipo;

alert("Scontrino: "+tipo);

}




function chiudiConto(){


let conferma =
confirm(
"Chiudere il conto?"
);


if(conferma){


localStorage.removeItem("ordini");



alert(
"Conto chiuso ✅"
);



window.location.href="tavoli.html";


}


}



</script>



</body>

</html>
