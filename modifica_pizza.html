<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modifica Pizza - Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
margin:0;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:18px;
margin:8px 0;
border:0;
border-radius:15px;
font-size:20px;
font-weight:bold;
color:white;
}

.extra{
background:#197619;
}

.togli{
background:#8a1616;
}

.conferma{
background:#005f9e;
}

</style>

</head>


<body>


<h1>🍕 MODIFICA PIZZA</h1>


<div class="box">

<h2 id="pizza"></h2>

<h2>
Prezzo: € <span id="prezzo"></span>
</h2>

</div>




<div class="box">

<h2>❌ Togli ingredienti</h2>

<button class="togli" onclick="modifica('senza mozzarella',0)">
❌ Senza mozzarella
</button>

<button class="togli" onclick="modifica('senza pomodoro',0)">
❌ Senza pomodoro
</button>

<button class="togli" onclick="modifica('senza basilico',0)">
❌ Senza basilico
</button>

</div>




<div class="box">

<h2>➕ Extra</h2>


<button class="extra" onclick="modifica('bufala',2)">
➕ Bufala +2 €
</button>


<button class="extra" onclick="modifica('prosciutto',1.5)">
➕ Prosciutto +1,50 €
</button>


<button class="extra" onclick="modifica('funghi',1)">
➕ Funghi +1 €
</button>


<button class="extra" onclick="modifica('olive',1)">
➕ Olive +1 €
</button>


<button class="extra" onclick="modifica('salame piccante',1.5)">
➕ Salame piccante +1,50 €
</button>


</div>




<div class="box">

<button class="conferma" onclick="conferma()">

✅ CONFERMA PIZZA

</button>

</div>




<script>


let dati =
new URLSearchParams(window.location.search);


let nome =
dati.get("nome");


let prezzo =
Number(dati.get("prezzo"));


let modifiche=[];



document.getElementById("pizza").innerHTML =
"🍕 "+nome;


document.getElementById("prezzo").innerHTML =
prezzo.toFixed(2);




function modifica(tipo,costo){


modifiche.push(tipo);


prezzo += costo;


document.getElementById("prezzo").innerHTML =
prezzo.toFixed(2);


}




function conferma(){


let descrizione =
nome+" ("+modifiche.join(", ")+")";



window.location.href =
"ordine.html?pizza="+
encodeURIComponent(descrizione)+
"&prezzo="+
prezzo;


}



</script>



</body>

</html>
