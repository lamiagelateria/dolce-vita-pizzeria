<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modifica Pizza</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
}

.box{
background:#333;
margin:20px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:18px;
margin:8px 0;
border:0;
border-radius:15px;
background:#444;
color:white;
font-size:20px;
font-weight:bold;
}

.extra{
background:#197619;
}

.togli{
background:#8a1616;
}

.conferma{
background:#005f9e;
}

</style>

</head>


<body>


<h1>🍕 MODIFICA PIZZA</h1>



<div class="box">

<h2 id="nomePizza"></h2>

<div id="prezzo">
</div>

</div>



<div class="box">

<h2>❌ Togli ingredienti</h2>


<button onclick="togli('senza mozzarella')">
Senza mozzarella
</button>


<button onclick="togli('senza pomodoro')">
Senza pomodoro
</button>


<button onclick="togli('senza basilico')">
Senza basilico
</button>


</div>




<div class="box">

<h2>➕ Extra</h2>


<button class="extra" onclick="extra('Bufala',2)">
Bufala +2 €
</button>


<button class="extra" onclick="extra('Prosciutto',1.5)">
Prosciutto +1,50 €
</button>


<button class="extra" onclick="extra('Funghi',1)">
Funghi +1 €
</button>


<button class="extra" onclick="extra('Olive',1)">
Olive +1 €
</button>


<button class="extra" onclick="extra('Salame piccante',1.5)">
Salame piccante +1,50 €
</button>


</div>




<div class="box">


<h2>
Totale pizza:
€ <span id="totale"></span>
</h2>


<button class="conferma" onclick="conferma()">

✅ CONFERMA PIZZA

</button>


</div>




<script>


let dati =
new URLSearchParams(window.location.search);



let nome =
dati.get("nome");


let prezzo =
Number(dati.get("prezzo"));


let tavolo =
dati.get("tavolo");


let coperto =
dati.get("coperto");



let modifiche=[];



document.getElementById("nomePizza").innerHTML=
"🍕 "+nome;


document.getElementById("totale").innerHTML=
prezzo.toFixed(2);





function extra(nomeExtra,costo){

modifiche.push(
" + "+nomeExtra
);


prezzo += costo;


document.getElementById("totale").innerHTML=
prezzo.toFixed(2);

}





function togli(cosa){

modifiche.push(
" "+cosa
);

}





function conferma(){


let descrizione =
nome +
modifiche.join(",");



window.location.href =

"ordine.html?tavolo="
+tavolo+
"&coperto="
+coperto+
"&pizza="
+encodeURIComponent(descrizione)+
"&prezzo="
+prezzo;


}



</script>



</body>

</html>
