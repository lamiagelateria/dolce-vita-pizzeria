<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Modifica Pizza</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:38px;
}


.box{
background:#333;
margin:20px;
padding:25px;
border-radius:20px;
}


button{
width:100%;
padding:18px;
margin:8px 0;
border:none;
border-radius:15px;
background:#444;
color:white;
font-size:22px;
font-weight:bold;
}


.extra{
background:#197619;
}


.togli{
background:#8a1616;
}


.conferma{
background:#005f9e;
}


</style>

</head>


<body>


<h1>🍕 MODIFICA PIZZA</h1>



<div class="box">


<h2>Pizza scelta</h2>


<div id="pizza">

Margherita €7

</div>


</div>




<div class="box">


<h2>❌ Togli ingredienti</h2>


<button class="togli">

❌ Senza mozzarella

</button>


<button class="togli">

❌ Senza pomodoro

</button>


<button class="togli">

❌ Senza basilico

</button>


</div>




<div class="box">


<h2>➕ Extra</h2>


<button class="extra">

➕ Bufala +2 €

</button>


<button class="extra">

➕ Prosciutto +1,50 €

</button>


<button class="extra">

➕ Funghi +1 €

</button>


<button class="extra">

➕ Olive +1 €

</button>


<button class="extra">

➕ Salame piccante +1,50 €

</button>


<button class="extra">

➕ Verdure grigliate +2 €

</button>


</div>




<div class="box">


<h2>Prezzo finale</h2>


<h1>
€7,00
</h1>


<button class="conferma">

✅ CONFERMA PIZZA

</button>


</div>



</body>

</html>
