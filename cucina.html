<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cucina Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
margin:0;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

.ordine{
background:#444;
padding:15px;
border-radius:15px;
margin-top:10px;
}

button{
width:100%;
padding:18px;
margin-top:10px;
border:0;
border-radius:15px;
font-size:20px;
font-weight:bold;
background:#197619;
color:white;
}

.vuoto{
text-align:center;
font-size:25px;
}

</style>

</head>


<body>


<h1>👨‍🍳 CUCINA DOLCE VITA</h1>


<div id="lista"></div>




<script>


let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



let contenuto="";




if(ordini.length===0){


contenuto=

"<div class='box vuoto'>Nessun ordine</div>";



}else{



ordini.forEach(function(o,index){



contenuto +=


`

<div class="box">


<h2>🍕 Ordine ${index+1}</h2>


<div class="ordine">


`;



o.prodotti.forEach(function(p){


contenuto +=

"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";



});



contenuto +=


`

<br>

💶 Totale: €${o.totale.toFixed(2)}

<br>


<button onclick="pronto(${index})">

✅ ORDINE PRONTO

</button>


</div>


</div>


`;



});



}





document.getElementById("lista").innerHTML =
contenuto;






function pronto(index){


ordini.splice(index,1);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



location.reload();


}



</script>



</body>

</html>
