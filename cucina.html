<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cucina Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
color:white;
background:#197619;
}

.home{
background:#555;
}

.pronto{
background:#006600;
}

</style>

</head>


<body>


<h1>👨‍🍳 CUCINA DOLCE VITA</h1>


<div class="box">

<button class="home" onclick="home()">

🏠 TORNA ALLA HOME

</button>

</div>


<div id="lista"></div>



<script>


let ordini = JSON.parse(localStorage.getItem("ordini")) || [];


let lista = document.getElementById("lista");




function mostra(){


let html="";



if(ordini.length==0){


html=`

<div class="box">

<h2>Nessun ordine</h2>

</div>

`;



}else{



ordini.forEach(function(o,index){



html += `

<div class="box">


<h2>

🍽️ TAVOLO ${o.tavolo || "1"}

</h2>


👥 Persone: ${o.persone || "1"}

<br><br>

`;



o.prodotti.forEach(function(p){


html +=

p.nome+" €"+p.prezzo+
"<br>";



});



html += `


<br>

💶 Totale: €${Number(o.totale).toFixed(2)}

<br>

📌 Stato: ${o.stato || "In preparazione"}



<button class="pronto" onclick="pronto(${index})">

✅ ORDINE PRONTO

</button>


</div>

`;



});



}



lista.innerHTML=html;


}





function pronto(index){


ordini[index].stato="Pronto";


localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



mostra();


}





function home(){


window.location.href="index.html";


}



mostra();


</script>


</body>

</html>
