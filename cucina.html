<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Cucina</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:40px;
}


.ordine{

background:#333;
margin:20px;
padding:25px;
border-radius:20px;
font-size:22px;

}


button{

width:100%;
padding:20px;
margin-top:10px;
border:none;
border-radius:18px;
font-size:22px;
font-weight:bold;
color:white;

}


.pronto{
background:#197619;
}


.elimina{
background:#8a1616;
}


.indietro{

display:block;
margin:20px;
padding:20px;
background:#333;
color:white;
text-align:center;
border-radius:20px;
text-decoration:none;
font-size:25px;

}

</style>

</head>



<body>


<h1>👨‍🍳 CUCINA</h1>



<div id="lista">

</div>



<a class="indietro" href="index.html">

⬅️ Torna alla cassa

</a>



<script src="gestione.js"></script>


<script>


function mostraOrdini(){


let ordini =
prendiOrdini();


let contenuto="";



if(ordini.length==0){

contenuto=

"<div class='ordine'>"+
"Nessun ordine aperto"+
"</div>";

}



ordini.forEach((ordine,index)=>{


contenuto +=

"<div class='ordine'>"+

"<h2>🍕 "+ordine.tipo+"</h2>"+

"👤 "+(ordine.cliente || "")+
"<br>"+

"🍽️ "+(ordine.tavolo || "")+
"<br><br>"+

"Stato: 🟡 "+
ordine.stato+

"<br><br>"+


"<button class='pronto' onclick='pronto("+index+")'>"+
"✅ PRONTO"+
"</button>"+


"<button class='elimina' onclick='elimina("+index+")'>"+
"❌ ELIMINA"+
"</button>"+


"</div>";



});



document.getElementById("lista").innerHTML =
contenuto;


}




function pronto(numero){

aggiornaStato(
numero,
"Pronto"
);

mostraOrdini();

}




function elimina(numero){

eliminaOrdine(numero);

mostraOrdini();

}




mostraOrdini();


</script>


</body>

</html>
