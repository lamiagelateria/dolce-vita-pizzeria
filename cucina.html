<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cucina Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

.asporto{
border:3px solid #8a5a00;
}

.tavolo{
border:3px solid #197619;
}

button{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:15px;
background:#197619;
color:white;
font-size:18px;
font-weight:bold;
}

.home{
background:#555;
}

</style>

</head>


<body>


<h1>👨‍🍳 CUCINA DOLCE VITA</h1>



<div class="box">

<button class="home" onclick="home()">

🏠 TORNA ALLA HOME

</button>

</div>



<div id="lista"></div>
<script>


let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



let lista=document.getElementById("lista");





function mostra(){


let testo="";



if(ordini.length==0){


testo=`

<div class="box">

<h2>Nessun ordine</h2>

</div>

`;



}else{


ordini.forEach(function(o,index){



let tipo = o.tipo || "Tavolo";



if(tipo=="Asporto"){



testo +=


`

<div class="box asporto">


<h2>🛍️ ASPORTO</h2>


👤 Cliente: ${o.cliente || "Cliente"}

<br>

📞 Telefono: ${o.telefono || "-"}

<br>

⏰ Ritiro: ${o.orario || "-"}


<br><br>


`;



}else{



testo +=


`

<div class="box tavolo">


<h2>

🍽️ TAVOLO ${o.tavolo || "1"}

</h2>


👥 Persone: ${o.persone || "1"}

<br><br>


`;



}





o.prodotti.forEach(function(p){


testo +=

"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";



});




testo +=


`

<br>

💶 Totale: €${o.totale.toFixed(2)}



<button onclick="pronto(${index})">

✅ ORDINE PRONTO

</button>


</div>


`;



});



}



lista.innerHTML=testo;


}








function pronto(index){


ordini.splice(index,1);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



mostra();


}






function home(){


window.location.href="index.html";


}




mostra();


</script>


</body>

</html>
