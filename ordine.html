<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ordine Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
margin:0;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:18px;
margin:8px 0;
border:0;
border-radius:15px;
font-size:21px;
background:#555;
color:white;
font-weight:bold;
}

.invia{
background:#197619;
}

.totale{
font-size:35px;
color:#4cff4c;
}

</style>

</head>


<body>


<h1>🍕 ORDINE DOLCE VITA</h1>



<div class="box">

<h2>🍕 PIZZE</h2>

<div id="menuPizze"></div>

</div>




<div class="box">

<h2>🧾 ORDINE</h2>

<div id="lista">
Nessun prodotto
</div>


<br>


<div class="totale">

Totale € <span id="totale">0.00</span>

</div>

</div>




<div class="box">

<button class="invia" onclick="inviaCucina()">

👨‍🍳 INVIA IN CUCINA

</button>

</div>



<script src="pizze.js"></script>



<script>


let prodotti=[];

let totale=0;




pizze.forEach(function(p){


document.getElementById("menuPizze").innerHTML +=


`

<button onclick="aggiungi('${p.nome}',${p.prezzo})">

🍕 ${p.nome} €${p.prezzo}

</button>

`;


});






function aggiungi(nome,prezzo){


prodotti.push({

nome:nome,

prezzo:prezzo

});


totale += prezzo;


mostra();


}





function mostra(){


let testo="";


prodotti.forEach(function(p){


testo +=
"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";


});


document.getElementById("lista").innerHTML =
testo;


document.getElementById("totale").innerHTML =
totale.toFixed(2);


}





function inviaCucina(){


let ordine={

tipo:"Tavolo",

prodotti:prodotti,

totale:totale,

stato:"In preparazione"

};



let ordini =
JSON.parse(localStorage.getItem("ordini")) || [];



ordini.push(ordine);



localStorage.setItem(
"ordini",
JSON.stringify(ordini)
);



alert("Ordine inviato in cucina ✅");


window.location.href="cucina.html";


}



</script>



</body>

</html>
