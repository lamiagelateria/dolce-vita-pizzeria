<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ordine Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
margin:0;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:16px;
margin:6px 0;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:#555;
color:white;
}

.invia{
background:#197619;
}

.totale{
color:#4cff4c;
font-size:35px;
}

</style>

</head>


<body>


<h1>🍕 ORDINE DOLCE VITA</h1>



<div class="box">

<h2>🍕 MENU</h2>

<div id="menu"></div>

</div>




<div class="box">

<h2>🧾 ORDINE</h2>

<div id="lista">
Nessun prodotto
</div>


<br>

<div class="totale">

Totale € <span id="totale">0.00</span>

</div>

</div>




<div class="box">

<button class="invia" onclick="inviaCucina()">

👨‍🍳 INVIA IN CUCINA

</button>

</div>




<script src="pizze.js"></script>

<script src="prodotti.js"></script>



<script>


let prodottiOrdine=[];

let totale=0;





let pizzaSalvata =
JSON.parse(localStorage.getItem("pizzaModificata"));



if(pizzaSalvata){

prodottiOrdine.push(pizzaSalvata);

totale += pizzaSalvata.prezzo;


localStorage.removeItem("pizzaModificata");

}






function aggiungi(nome,prezzo){


prodottiOrdine.push({

nome:nome,

prezzo:prezzo

});


totale += prezzo;


mostra();


}






function modificaPizza(nome,prezzo){


window.location.href =

"modifica_pizza.html?nome="
+
encodeURIComponent(nome)
+
"&prezzo="
+
prezzo;


}






pizze.forEach(function(p){


document.getElementById("menu").innerHTML +=


`

<button onclick="modificaPizza('${p.nome}',${p.prezzo})">

🍕 ${p.nome} €${p.prezzo}

</button>

`;

});






prodotti.forEach(function(p){


document.getElementById("menu").innerHTML +=


`

<button onclick="aggiungi('${p.nome}',${p.prezzo})">

${p.categoria} - ${p.nome} €${p.prezzo}

</button>

`;

});







function mostra(){


let testo="";


prodottiOrdine.forEach(function(p){


testo +=

"🍽️ "+p.nome+
" €"+p.prezzo+
"<br>";



});



if(testo==""){

testo="Nessun prodotto";

}


document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=

totale.toFixed(2);


}






mostra();







function inviaCucina(){


let ordine={

tipo:"Tavolo",

prodotti:prodottiOrdine,

totale:totale,

stato:"In preparazione"

};



let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



ordini.push(ordine);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Ordine inviato in cucina ✅");



window.location.href="cucina.html";


}



</script>


</body>

</html>
