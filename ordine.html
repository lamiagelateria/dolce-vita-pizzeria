<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ordine Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin:5px 0;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:#555;
color:white;
}

.aggiungi{
background:#197619;
}

.invia{
background:#006600;
}

.totale{
font-size:30px;
color:#4cff4c;
}

.info{
color:#00d9ff;
font-size:22px;
}

</style>

</head>


<body>


<h1>🍕 ORDINE DOLCE VITA</h1>


<div class="box">

<div id="info" class="info"></div>

</div>


<div class="box">

<h2>🍕 MENU</h2>

<div id="menu"></div>

</div>


<div class="box">

<h2>🧾 ORDINE</h2>

<div id="lista">

Nessun prodotto

</div>


<h2 class="totale">

Totale € <span id="totale">0.00</span>

</h2>

</div>


<div class="box">

<button class="invia" onclick="invia()">

👨‍🍳 INVIA IN CUCINA

</button>

</div>


<script src="pizze.js"></script>
<script src="prodotti.js"></script>
<script>


let prodottiOrdine = [];

let totale = 0;



let pizzaModificata = JSON.parse(
localStorage.getItem("pizzaModificata")
);



if(pizzaModificata){


prodottiOrdine.push(pizzaModificata);


totale += Number(pizzaModificata.prezzo);


localStorage.removeItem("pizzaModificata");


}


let tavolo = localStorage.getItem("tavoloAttivo") || "1";

let persone = localStorage.getItem("personeTavolo") || "1";



document.getElementById("info").innerHTML =

"🍽️ Tavolo " + tavolo +
" 👥 Persone: " + persone;





function creaMenu(){


let menu = document.getElementById("menu");



pizze.forEach(function(p){


menu.innerHTML += `

<button class="aggiungi" onclick="aggiungi('${p.nome}',${p.prezzo})">

🍕 ${p.nome} €${p.prezzo}

</button>

`;



});



prodotti.forEach(function(p){


menu.innerHTML += `

<button class="aggiungi" onclick="aggiungi('${p.nome}',${p.prezzo})">

${p.nome} €${p.prezzo}

</button>

`;



});



}





function aggiungi(nome,prezzo){


prodottiOrdine.push({

nome:nome,

prezzo:Number(prezzo)

});


totale += Number(prezzo);


mostra();


}





function mostra(){


let testo="";


prodottiOrdine.forEach(function(p){


testo +=

"🍽️ "+p.nome+
" €"+p.prezzo+
"<br>";


});



if(testo==""){

testo="Nessun prodotto";

}



document.getElementById("lista").innerHTML=testo;



document.getElementById("totale").innerHTML=

totale.toFixed(2);


}



creaMenu();
mostra();

function invia(){


if(prodottiOrdine.length === 0){

alert("Aggiungi almeno un prodotto");

return;

}



let nuovoOrdine = {

id: Date.now(),

tipo:"Tavolo",

tavolo:tavolo,

persone:persone,

prodotti:prodottiOrdine,

totale:Number(totale),

stato:"In preparazione"

};




let ordini = JSON.parse(localStorage.getItem("ordini")) || [];



ordini.push(nuovoOrdine);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Ordine inviato in cucina ✅");



window.location.href="cucina.html";


}


</script>


</body>

</html>
