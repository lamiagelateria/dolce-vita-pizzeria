<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ordine Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

h2{
color:#ffd000;
}

button{
width:100%;
padding:15px;
margin:5px 0;
border:0;
border-radius:15px;
background:#555;
color:white;
font-size:18px;
font-weight:bold;
}

hr{
border:1px solid #777;
margin:20px 0;
}

.invia{
background:#197619;
}

.totale{
font-size:35px;
color:#4cff4c;
}

.info{
color:#00d9ff;
font-size:22px;
font-weight:bold;
}

</style>

</head>


<body>


<h1>🍕 ORDINE DOLCE VITA</h1>


<div class="box">

<div class="info" id="infoTavolo"></div>

</div>


<div class="box">


<h2>🍕 PIZZE</h2>

<div id="menuPizze"></div>


<hr>


<h2>🥤 BIBITE</h2>

<div id="menuBibite"></div>


<hr>


<h2>🍺 BIRRE</h2>

<div id="menuBirre"></div>


<hr>


<h2>🍷 VINI</h2>

<div id="menuVini"></div>


<hr>


<h2>🍟 FRITTI</h2>

<div id="menuFritti"></div>


</div>



<div class="box">

<h2>🧾 ORDINE</h2>


<div id="lista">

Nessun prodotto

</div>


<br>


<div class="totale">

Totale € <span id="totale">0.00</span>

</div>


</div>



<div class="box">

<button class="invia" onclick="inviaCucina()">

👨‍🍳 INVIA IN CUCINA

</button>


</div>



<script src="pizze.js"></script>

<script src="prodotti.js"></script>
 <script>


let prodottiOrdine=[];

let totale=0;



let tavolo = localStorage.getItem("tavoloAttivo") || "1";

let persone = localStorage.getItem("personeTavolo") || "1";



document.getElementById("infoTavolo").innerHTML =

"🍽️ Tavolo " + tavolo + 
" 👥 Persone: " + persone;





let salvata =

JSON.parse(localStorage.getItem("pizzaModificata"));



if(salvata){

prodottiOrdine.push(salvata);

totale += salvata.prezzo;

localStorage.removeItem("pizzaModificata");

}






pizze.forEach(function(p){


document.getElementById("menuPizze").innerHTML +=


`

<button onclick="modificaPizza('${p.nome}',${p.prezzo})">

🍕 ${p.nome} €${p.prezzo}

</button>

`;

});






prodotti.forEach(function(p){


let box="menuBibite";


if(p.categoria.includes("Birre"))

box="menuBirre";


if(p.categoria.includes("Vini"))

box="menuVini";


if(p.categoria.includes("Fritti"))

box="menuFritti";



document.getElementById(box).innerHTML +=


`

<button onclick="aggiungi('${p.nome}',${p.prezzo})">

${p.nome} €${p.prezzo}

</button>

`;

});







function aggiungi(nome,prezzo){


prodottiOrdine.push({

nome:nome,

prezzo:prezzo

});


totale += prezzo;


mostra();

}






function modificaPizza(nome,prezzo){


window.location.href =

"modifica_pizza.html?nome="
+
encodeURIComponent(nome)
+
"&prezzo="
+
prezzo;


}







function mostra(){


let testo="";


prodottiOrdine.forEach(function(p){


testo +=

"🍽️ "+p.nome+
" €"+p.prezzo+
"<br>";



});



if(testo=="")
testo="Nessun prodotto";



document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=

totale.toFixed(2);


}





mostra();







function inviaCucina(){


let ordine={


tipo:"Tavolo",


tavolo:tavolo,


persone:persone,


prodotti:prodottiOrdine,


totale:totale,


stato:"In preparazione"


};




let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



ordini.push(ordine);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Ordine inviato in cucina ✅");



window.location.href="cucina.html";


}


</script>


</body>

</html>
