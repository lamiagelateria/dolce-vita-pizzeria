<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Ordine</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:38px;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:18px;
margin:8px 0;
border:none;
border-radius:15px;
background:#444;
color:white;
font-size:22px;
font-weight:bold;
}

.invia{
background:#197619;
}

.cancella{
background:#8a1616;
}

.prodotto{
background:#222;
}

.totale{
color:#4cff4c;
font-size:35px;
}

</style>

</head>


<body>


<h1>🍕 ORDINE TAVOLO</h1>


<div class="box">

🍽️ Tavolo:
<span id="tavolo"></span>

<br><br>

👥 Persone:
<span id="persone"></span>

<br><br>

💶 Coperto:
€ <span id="coperto"></span>

</div>



<div class="box">

<h2>🍕 Pizze</h2>

<button class="prodotto" onclick="aggiungi('Margherita',7)">
Margherita €7
</button>

<button class="prodotto" onclick="aggiungi('Marinara',6)">
Marinara €6
</button>

<button class="prodotto" onclick="aggiungi('Diavola',8)">
Diavola €8
</button>

<button class="prodotto" onclick="aggiungi('4 Formaggi',9)">
4 Formaggi €9
</button>

<button class="prodotto" onclick="aggiungi('Capricciosa',10)">
Capricciosa €10
</button>

</div>




<div class="box">

<h2>🍟 Fritti</h2>

<button onclick="aggiungi('Patatine',4)">
🍟 Patatine €4
</button>

</div>




<div class="box">

<h2>🥤 Bibite</h2>

<button onclick="aggiungi('Coca Cola',3)">
Coca Cola €3
</button>

<button onclick="aggiungi('Fanta',3)">
Fanta €3
</button>

<button onclick="aggiungi('Sprite',3)">
Sprite €3
</button>

<button onclick="aggiungi('The freddo',3)">
The freddo €3
</button>

</div>




<div class="box">

<h2>🍺 Birre</h2>

<button onclick="aggiungi('Moretti',4)">
Moretti €4
</button>

<button onclick="aggiungi('Ichnusa',4)">
Ichnusa €4
</button>

<button onclick="aggiungi('Heineken',4)">
Heineken €4
</button>

<button onclick="aggiungi('Artigianale',6)">
Birra artigianale €6
</button>

</div>




<div class="box">

<h2>🍰 Dolci</h2>

<button onclick="aggiungi('Tiramisù',5)">
Tiramisù €5
</button>

<button onclick="aggiungi('Panna cotta',5)">
Panna cotta €5
</button>

<button onclick="aggiungi('Cheesecake',5)">
Cheesecake €5
</button>

</div>




<div class="box">

<h2>👧 Menu bambini</h2>

<button onclick="aggiungi('Pasta pomodoro + bibita',8)">
Pasta pomodoro + bibita €8
</button>

<button onclick="aggiungi('Pasta ragù + bibita',8)">
Pasta ragù + bibita €8
</button>

<button onclick="aggiungi('Cotoletta patatine + bibita',9)">
Cotoletta + patatine + bibita €9
</button>

</div>




<div class="box">

<h2>🧾 Ordine</h2>

<div id="lista">
Nessun prodotto
</div>

<br>

<div class="totale">
Totale € <span id="totale">0</span>
</div>


<button class="invia" onclick="mandaCucina()">
👨‍🍳 INVIA IN CUCINA
</button>


<button class="cancella" onclick="cancella()">
❌ CANCELLA
</button>


</div>



<script src="gestione.js"></script>
<script src="tavoli.js"></script>


<script>


let parametri =
new URLSearchParams(window.location.search);


let tavolo =
parametri.get("tavolo");


let persone =
parametri.get("persone");


let coperto =
Number(parametri.get("coperto"));



document.getElementById("tavolo").innerHTML=tavolo;

document.getElementById("persone").innerHTML=persone;

document.getElementById("coperto").innerHTML=coperto.toFixed(2);



let prodotti=[];

let totale=coperto;



function aggiungi(nome,prezzo){

prodotti.push({
nome:nome,
prezzo:prezzo
});


totale += prezzo;

mostra();

}



function mostra(){

let testo="";


prodotti.forEach((p,i)=>{

testo += 
(i+1)+") "+p.nome+
" €"+p.prezzo+
"<br>";

});


if(testo==""){
testo="Nessun prodotto";
}


document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=
totale.toFixed(2);


}



function mandaCucina(){


let ordine={

tipo:"Tavolo",

tavolo:tavolo,

persone:persone,

prodotti:prodotti,

totale:totale,

stato:"In preparazione"

};


salvaOrdine(ordine);

occupaTavolo(tavolo);


alert("Ordine inviato in cucina ✅");


}




function cancella(){

prodotti=[];

totale=coperto;

mostra();

}



</script>


</body>

</html>
