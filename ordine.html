<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Ordine Tavolo</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:38px;
}

.box{
background:#333;
margin:20px;
padding:25px;
border-radius:20px;
font-size:22px;
}


button{
width:100%;
padding:22px;
margin:10px 0;
border:none;
border-radius:20px;
background:#444;
color:white;
font-size:23px;
font-weight:bold;
}


.invia{
background:#197619;
}


.elimina{
background:#8a1616;
}


.totale{
color:#4cff4c;
font-size:35px;
}


</style>

</head>


<body>


<h1>🍕 ORDINE TAVOLO</h1>


<div class="box">

🍽️ Tavolo:
<span id="tavolo"></span>

<br><br>

👥 Persone:
<span id="persone"></span>

<br><br>

💶 Coperto:
€ <span id="coperto"></span>

</div>



<div class="box">


<h2>Menu veloce</h2>


<button onclick="aggiungi('Margherita',7)">
🍕 Margherita €7
</button>


<button onclick="aggiungi('Diavola',8)">
🍕 Diavola €8
</button>


<button onclick="aggiungi('4 Formaggi',9)">
🍕 4 Formaggi €9
</button>


<button onclick="aggiungi('Patatine',4)">
🍟 Patatine €4
</button>


<button onclick="aggiungi('Coca Cola',3)">
🥤 Coca Cola €3
</button>


</div>




<div class="box">


<h2>🧾 Ordine</h2>


<div id="lista">

Nessun prodotto

</div>


<br>


<div class="totale">

Totale:
€ <span id="totale">0</span>

</div>


<button class="invia" onclick="mandaCucina()">

👨‍🍳 INVIA IN CUCINA

</button>


<button class="elimina" onclick="cancella()">

❌ CANCELLA ORDINE

</button>


</div>



<script src="gestione.js"></script>


<script>


let parametri =
new URLSearchParams(window.location.search);



let tavolo =
parametri.get("tavolo");


let persone =
parametri.get("persone");


let coperto =
Number(parametri.get("coperto"));



document.getElementById("tavolo").innerHTML=tavolo;

document.getElementById("persone").innerHTML=persone;

document.getElementById("coperto").innerHTML=coperto.toFixed(2);



let prodotti=[];


let totale=coperto;



function aggiungi(nome,prezzo){


prodotti.push({

nome:nome,
prezzo:prezzo

});


totale += prezzo;


mostra();


}



function mostra(){


let testo="";


prodotti.forEach(p=>{

testo +=
"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";

});


if(testo==""){

testo="Nessun prodotto";

}


document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=
totale.toFixed(2);


}




function mandaCucina(){


let ordine={

tipo:"Tavolo",

tavolo:tavolo,

persone:persone,

prodotti:prodotti,

totale:totale,

stato:"In preparazione"

};


salvaOrdine(ordine);



alert("Ordine inviato in cucina ✅");


}



function cancella(){

prodotti=[];

totale=coperto;

mostra();

}


</script>


</body>

</html>
