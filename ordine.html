<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ordine Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
margin:0;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:18px;
margin:8px 0;
border:0;
border-radius:15px;
font-size:22px;
background:#555;
color:white;
font-weight:bold;
}

.totale{
font-size:35px;
color:#4cff4c;
}

.invia{
background:#197619;
}

</style>

</head>


<body>


<h1>🍕 ORDINE</h1>


<div class="box">

<h2>Tavolo:</h2>
<span id="tavolo">-</span>

</div>



<div class="box">

<h2>🍕 Pizze</h2>


<button onclick="aggiungi('Margherita',7)">
Margherita €7
</button>


<button onclick="aggiungi('Diavola',8)">
Diavola €8
</button>


<button onclick="aggiungi('4 Formaggi',9)">
4 Formaggi €9
</button>


</div>




<div class="box">

<h2>🧾 Ordine</h2>

<div id="lista">
Nessun prodotto
</div>


<br>


<div class="totale">

Totale € <span id="totale">0.00</span>

</div>


</div>




<div class="box">


<button class="invia" onclick="inviaCucina()">

👨‍🍳 INVIA IN CUCINA

</button>


</div>




<script>


let prodotti=[];

let totale=0;



function aggiungi(nome,prezzo){


prodotti.push({

nome:nome,

prezzo:prezzo

});


totale = totale + prezzo;


mostra();


}




function mostra(){


let testo="";


prodotti.forEach(function(p){


testo += 
p.nome+" €"+p.prezzo+
"<br>";


});


document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=
totale.toFixed(2);


}




function inviaCucina(){


alert("Ordine inviato in cucina ✅");


}



</script>



</body>

</html>
