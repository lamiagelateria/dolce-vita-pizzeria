<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ordine Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:15px;
margin:5px 0;
border:0;
border-radius:15px;
font-size:18px;
font-weight:bold;
background:#555;
color:white;
}

.aggiungi{
background:#197619;
}

.quantita{
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.quantita button{
width:60px;
background:#197619;
}

.rimuovi{
background:#8a1616;
}

.invia{
background:#006600;
}

.totale{
font-size:30px;
color:#4cff4c;
}

.info{
color:#00d9ff;
font-size:22px;
}

</style>

</head>


<body>


<h1>🍕 ORDINE DOLCE VITA</h1>


<div class="box">

<div id="info" class="info"></div>

</div>


<div class="box">

<h2>🍕 MENU</h2>

<div id="menu"></div>

</div>


<div class="box">

<h2>🧾 ORDINE</h2>

<div id="lista">
Nessun prodotto
</div>


<h2 class="totale">

Totale € <span id="totale">0.00</span>

</h2>

</div>


<div class="box">

<button class="invia" onclick="invia()">

👨‍🍳 INVIA IN CUCINA

</button>

</div>


<script src="pizze.js"></script>

<script src="prodotti.js"></script>


<script>

let prodottiOrdine = [];

let totale = 0;


let tavolo = localStorage.getItem("tavoloAttivo") || "1";

let persone = localStorage.getItem("personeTavolo") || "1";


document.getElementById("info").innerHTML =

"🍽️ Tavolo " + tavolo +
" 👥 Persone: " + persone;



let pizzaModificata = JSON.parse(
localStorage.getItem("pizzaModificata")
);


if(pizzaModificata){

pizzaModificata.quantita = 1;

prodottiOrdine.push(pizzaModificata);

localStorage.removeItem("pizzaModificata");

}
function creaMenu(){

let menu = document.getElementById("menu");


pizze.forEach(function(p){

menu.innerHTML += `

<button class="aggiungi" onclick="aggiungi('${p.nome}',${p.prezzo})">

🍕 ${p.nome} €${p.prezzo}

</button>

`;

});


prodotti.forEach(function(p){

menu.innerHTML += `

<button class="aggiungi" onclick="aggiungi('${p.nome}',${p.prezzo})">

${p.nome} €${p.prezzo}

</button>

`;

});


}



function aggiungi(nome,prezzo){


let trovato = prodottiOrdine.find(function(p){

return p.nome === nome;

});


if(trovato){


trovato.quantita = trovato.quantita + 1;


}else{


prodottiOrdine.push({

nome:nome,

prezzo:Number(prezzo),

quantita:1

});


}


ricalcolaTotale();

mostra();


}




function cambiaQuantita(index,numero){


prodottiOrdine[index].quantita += numero;



if(prodottiOrdine[index].quantita <= 0){


prodottiOrdine.splice(index,1);


}



ricalcolaTotale();

mostra();


}





function ricalcolaTotale(){


totale = 0;


prodottiOrdine.forEach(function(p){


totale += p.prezzo * p.quantita;


});


}




function mostra(){


let testo="";


prodottiOrdine.forEach(function(p,index){



testo +=

"🍽️ "+p.nome+
" €"+(p.prezzo*p.quantita).toFixed(2)+
"<br>";



testo += `

<div class="quantita">

<button onclick="cambiaQuantita(${index},-1)">

➖

</button>


<b>

${p.quantita}

</b>


<button onclick="cambiaQuantita(${index},1)">

➕

</button>


</div>

<br>

`;



});



if(testo==""){

testo="Nessun prodotto";

}



document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=

totale.toFixed(2);


}


creaMenu();

mostra();  
function invia(){


if(prodottiOrdine.length === 0){

alert("Aggiungi almeno un prodotto");

return;

}



let nuovoOrdine = {


id:Date.now(),


tipo:"Tavolo",


tavolo:tavolo,


persone:persone,


prodotti:prodottiOrdine,


totale:Number(totale),


stato:"In preparazione"


};




let ordini = JSON.parse(localStorage.getItem("ordini")) || [];



ordini.push(nuovoOrdine);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Ordine inviato in cucina ✅");



window.location.href="cucina.html";


}


</script>


</body>

</html>
