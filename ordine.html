<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Ordine</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

button{
width:100%;
padding:18px;
margin:8px 0;
border:0;
border-radius:15px;
background:#444;
color:white;
font-size:20px;
font-weight:bold;
}

.invia{
background:#197619;
}

.cancella{
background:#8a1616;
}

.totale{
color:#4cff4c;
font-size:32px;
}

</style>

</head>

<body>


<h1>🍕 ORDINE TAVOLO</h1>


<div class="box">

Tavolo:
<span id="tavolo"></span>

<br><br>

Coperto:
€<span id="coperto"></span>

</div>



<div class="box">

<h2>🍕 Pizze</h2>

<button onclick="aggiungiPizza('Margherita',7)">
🍕 Margherita €7
</button>

<button onclick="aggiungiPizza('Diavola',8)">
🍕 Diavola €8
</button>

<button onclick="aggiungiPizza('4 Formaggi',9)">
🍕 4 Formaggi €9
</button>


</div>




<div class="box">

<h2>🧾 Ordine</h2>

<div id="lista">
Vuoto
</div>

<br>

<div class="totale">

€ <span id="totale">0</span>

</div>


<button class="invia" onclick="mandaCucina()">
👨‍🍳 INVIA IN CUCINA
</button>


<button class="cancella" onclick="cancella()">
❌ CANCELLA
</button>


</div>




<script src="gestione.js"></script>

<script src="tavoli.js"></script>



<script>


let dati =
new URLSearchParams(window.location.search);


let tavolo =
dati.get("tavolo");


let coperto =
Number(dati.get("coperto"));



document.getElementById("tavolo").innerHTML=tavolo;

document.getElementById("coperto").innerHTML=coperto.toFixed(2);



let prodotti=[];

let totale=coperto;




function aggiungiPizza(nome,prezzo){


let modifica =
confirm(
"Vuoi modificare questa pizza?"
);


if(modifica){


window.location.href =
"modifica_pizza.html?nome="
+nome+
"&prezzo="
+prezzo+
"&tavolo="
+tavolo+
"&coperto="
+coperto;


return;

}



prodotti.push({

nome:nome,

prezzo:prezzo

});


totale += prezzo;


mostra();


}




function mostra(){


let testo="";


prodotti.forEach(p=>{


testo +=
"🍕 "+p.nome+
" €"+p.prezzo+
"<br>";


});


if(testo==""){

testo="Vuoto";

}


document.getElementById("lista").innerHTML=testo;


document.getElementById("totale").innerHTML=
totale.toFixed(2);


}





function mandaCucina(){


let ordine={

tipo:"Tavolo",

tavolo:tavolo,

prodotti:prodotti,

totale:totale,

stato:"In preparazione"

};


salvaOrdine(ordine);


occupaTavolo(tavolo);


alert("Mandato in cucina ✅");


}




function cancella(){

prodotti=[];

totale=coperto;

mostra();

}



</script>


</body>

</html>
