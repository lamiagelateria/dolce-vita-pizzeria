<!DOCTYPE html>
<html lang="it">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Ordine</title>

<style>

body {
    margin:0;
    background:#181818;
    color:white;
    font-family:Arial,sans-serif;
}

h1 {
    text-align:center;
    font-size:38px;
}

.box {
    background:#333;
    margin:20px;
    padding:20px;
    border-radius:20px;
}

button {
    width:100%;
    padding:22px;
    margin:8px 0;
    border:none;
    border-radius:18px;
    background:#444;
    color:white;
    font-size:22px;
    font-weight:bold;
}

button:active {
    background:#666;
}

.totale {
    color:#45ff45;
    font-size:32px;
}

.extra {
    background:#5b3a00;
}

.rimuovi {
    background:#6b0000;
}

</style>

</head>

<body>


<h1>🍕 DOLCE VITA</h1>


<div class="box">

🍽️ Tavolo:
<span id="tavolo"></span>

<br><br>

👥 Persone:
<span id="persone"></span>

<br><br>

💶 Coperto:
€ <span id="coperto"></span>

</div>



<div class="box">

<h2>🍕 Scegli pizza</h2>


<button onclick="apriPizza('Margherita',7)">
🍕 Margherita €7
</button>


<button onclick="apriPizza('Diavola',8)">
🍕 Diavola €8
</button>


<button onclick="apriPizza('4 Formaggi',9)">
🍕 4 Formaggi €9
</button>


</div>




<div class="box" id="personalizza" style="display:none;">


<h2>🔧 Personalizza pizza</h2>


<div id="pizzaScelta"></div>


<h3>Ingredienti da togliere</h3>


<button class="rimuovi" onclick="togli('Mozzarella')">
❌ Senza mozzarella
</button>


<button class="rimuovi" onclick="togli('Pomodoro')">
❌ Senza pomodoro
</button>


<button class="rimuovi" onclick="togli('Basilico')">
❌ Senza basilico
</button>



<h3>Extra</h3>


<button class="extra" onclick="extra('Mozzarella extra',0.50)">
➕ Mozzarella extra +€0,50
</button>


<button class="extra" onclick="extra('Prosciutto',1)">
➕ Prosciutto +€1,00
</button>


<button class="extra" onclick="extra('Funghi',1)">
➕ Funghi +€1,00
</button>


<button class="extra" onclick="extra('Patatine',1.50)">
➕ Patatine +€1,50
</button>


<button class="extra" onclick="extra('Bufala',2)">
➕ Bufala +€2,00
</button>



<button onclick="confermaPizza()">
✅ Aggiungi all'ordine
</button>


</div>





<div class="box">

<h2>🧾 Ordine</h2>


<div id="lista">
Nessun prodotto
</div>


<br>


<div class="totale">
Totale € <span id="totale">0.00</span>
</div>


</div>




<script>


let parametri = new URLSearchParams(window.location.search);


document.getElementById("tavolo").innerHTML =
parametri.get("tavolo");


document.getElementById("persone").innerHTML =
parametri.get("persone");


document.getElementById("coperto").innerHTML =
parametri.get("coperto");



let totale = Number(parametri.get("coperto"));


document.getElementById("totale").innerHTML =
totale.toFixed(2);



let pizzaAttuale="";
let prezzoPizza=0;

let modifiche=[];



function apriPizza(nome,prezzo){

pizzaAttuale=nome;
prezzoPizza=prezzo;

modifiche=[];

document.getElementById("personalizza").style.display="block";

document.getElementById("pizzaScelta").innerHTML =
"🍕 "+nome+" €"+prezzo;

}




function togli(nome){

modifiche.push("❌ Senza "+nome);

}




function extra(nome,prezzo){

modifiche.push("➕ "+nome);

prezzoPizza += prezzo;

}




function confermaPizza(){


let testo =
"🍕 "+pizzaAttuale+
" €"+prezzoPizza.toFixed(2);



if(modifiche.length>0){

testo += "<br>" + modifiche.join("<br>");

}



let lista=document.getElementById("lista");


if(lista.innerHTML=="Nessun prodotto"){

lista.innerHTML="";

}


lista.innerHTML += testo+"<br><br>";



totale += prezzoPizza;


document.getElementById("totale").innerHTML =
totale.toFixed(2);



document.getElementById("personalizza").style.display="none";


}


</script>


</body>
</html>
