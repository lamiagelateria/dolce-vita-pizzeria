<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Asporto</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:40px;
}

.box{
background:#333;
margin:20px;
padding:25px;
border-radius:20px;
}

input,button{
width:100%;
padding:20px;
margin:10px 0;
border-radius:15px;
border:none;
font-size:22px;
}

button{
background:#197619;
color:white;
font-weight:bold;
}

.ordine{
background:#222;
padding:20px;
border-radius:15px;
font-size:22px;
}

.indietro{
display:block;
margin:20px;
padding:20px;
background:#333;
color:white;
text-align:center;
border-radius:20px;
text-decoration:none;
font-size:25px;
}

</style>

</head>


<body>


<h1>🛍️ ASPORTO</h1>


<div class="box">


<input id="nome" placeholder="Nome cliente">

<input id="telefono" placeholder="Telefono">

<input id="ora" type="time">


<button onclick="creaOrdine()">
✅ SALVA ORDINE ASPORTO
</button>


</div>



<div class="box">


<h2>Ordine creato</h2>


<div id="ordine" class="ordine">

Nessun ordine

</div>


</div>



<a class="indietro" href="index.html">
⬅️ Torna alla cassa
</a>



<script src="gestione.js"></script>


<script>


function creaOrdine(){


let ordine={

tipo:"Asporto",

cliente:
document.getElementById("nome").value,

telefono:
document.getElementById("telefono").value,

ritiro:
document.getElementById("ora").value,

prodotti:[],

totale:0,

stato:"In preparazione"

};



salvaOrdine(ordine);



document.getElementById("ordine").innerHTML =

"✅ Ordine salvato<br><br>"+
"👤 "+ordine.cliente+
"<br>⏰ "+ordine.ritiro+
"<br>🟡 "+ordine.stato;


}



</script>


</body>

</html>
