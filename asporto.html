<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asporto Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.box{
background:#333;
margin:15px;
padding:20px;
border-radius:20px;
}

h2{
color:#ffd000;
}

input{
width:100%;
padding:15px;
margin:8px 0;
border-radius:10px;
border:0;
font-size:18px;
}

button{
width:100%;
padding:15px;
margin:5px 0;
border:0;
border-radius:15px;
background:#555;
color:white;
font-size:18px;
font-weight:bold;
}

.invia{
background:#8a5a00;
}

.totale{
font-size:30px;
color:#4cff4c;
}

</style>

</head>


<body>


<h1>🛍️ ASPORTO DOLCE VITA</h1>



<div class="box">


<h2>👤 Cliente</h2>


<input id="nome" placeholder="Nome cliente">


<input id="telefono" placeholder="Telefono">


<input id="orario" placeholder="Orario ritiro">


</div>




<div class="box">


<h2>🍕 PIZZE</h2>

<div id="menuPizze"></div>



<h2>🥤 BIBITE</h2>

<div id="menuBibite"></div>



<h2>🍺 BIRRE</h2>

<div id="menuBirre"></div>



<h2>🍷 VINI</h2>

<div id="menuVini"></div>



<h2>🍟 FRITTI</h2>

<div id="menuFritti"></div>



</div>




<div class="box">


<h2>🧾 ORDINE</h2>


<div id="lista">

Nessun prodotto

</div>


<br>


<div class="totale">

Totale € <span id="totale">0.00</span>

</div>



<button class="invia" onclick="inviaAsporto()">

🛍️ INVIA ASPORTO IN CUCINA

</button>


</div>




<script src="pizze.js"></script>

<script src="prodotti.js"></script>
<script>


let prodottiOrdine=[];

let totale=0;





pizze.forEach(function(p){


document.getElementById("menuPizze").innerHTML +=


`

<button onclick="aggiungi('${p.nome}',${p.prezzo})">

🍕 ${p.nome} €${p.prezzo}

</button>

`;

});








prodotti.forEach(function(p){


let box="menuBibite";



if(p.categoria.includes("Birre"))

box="menuBirre";



if(p.categoria.includes("Vini"))

box="menuVini";



if(p.categoria.includes("Fritti"))

box="menuFritti";





document.getElementById(box).innerHTML +=


`

<button onclick="aggiungi('${p.nome}',${p.prezzo})">

${p.nome} €${p.prezzo}

</button>

`;

});








function aggiungi(nome,prezzo){


prodottiOrdine.push({

nome:nome,

prezzo:prezzo

});



totale += prezzo;



mostra();


}







function mostra(){


let testo="";



prodottiOrdine.forEach(function(p){


testo +=

"🍽️ "+p.nome+
" €"+p.prezzo+
"<br>";



});



if(testo=="")
testo="Nessun prodotto";



document.getElementById("lista").innerHTML=testo;



document.getElementById("totale").innerHTML=

totale.toFixed(2);


}







function inviaAsporto(){



let ordine={


tipo:"Asporto",


cliente:document.getElementById("nome").value || "Cliente",


telefono:document.getElementById("telefono").value || "",


orario:document.getElementById("orario").value || "",


prodotti:prodottiOrdine,


totale:totale,


stato:"In preparazione"


};





let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



ordini.push(ordine);



localStorage.setItem(

"ordini",

JSON.stringify(ordini)

);



alert("Asporto inviato in cucina ✅");



window.location.href="cucina.html";


}




mostra();


</script>


</body>

</html>
