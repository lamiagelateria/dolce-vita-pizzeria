<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Tavoli</title>

<style>
body {
    margin: 0;
    background: #1e1e1e;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    padding: 20px;
}

h2 {
    margin-left: 20px;
}

.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    padding: 20px;
}

.tavolo {
    background: #333;
    border: 2px solid #555;
    border-radius: 15px;
    padding: 25px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
}

.libero {
    color: #4cff4c;
}

</style>

</head>

<body>

<h1>🍽️ TAVOLI</h1>

<h2>🏠 Sala interna</h2>

<div class="container">

<div class="tavolo libero">Tavolo 1<br>🟢 Libero</div>
<div class="tavolo libero">Tavolo 2<br>🟢 Libero</div>
<div class="tavolo libero">Tavolo 3<br>🟢 Libero</div>
<div class="tavolo libero">Tavolo 4<br>🟢 Libero</div>

</div>


<h2>🌳 Sala esterna</h2>

<div class="container">

<div class="tavolo libero">Esterno 1<br>🟢 Libero</div>
<div class="tavolo libero">Esterno 2<br>🟢 Libero</div>
<div class="tavolo libero">Esterno 3<br>🟢 Libero</div>
<div class="tavolo libero">Esterno 4<br>🟢 Libero</div>

</div>


</body>
</html>
