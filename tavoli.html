<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tavoli Dolce Vita</title>

<style>

body{
background:#181818;
color:white;
font-family:Arial;
}

h1{
text-align:center;
color:#ffd000;
}

.menu{
padding:15px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:15px;
font-size:20px;
font-weight:bold;
background:#005f9e;
color:white;
margin-bottom:15px;
}

.container{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
padding:15px;
}

.tavolo{
padding:25px;
border-radius:20px;
text-align:center;
font-size:22px;
font-weight:bold;
background:#197619;
}

.occupato{
background:#9b1616;
}

</style>

</head>


<body>


<h1>🍽️ TAVOLI DOLCE VITA</h1>



<div class="menu">

<button onclick="vaiCassa()">

💶 VAI ALLA CASSA

</button>

</div>




<div class="container" id="tavoli"></div>




<script>


let ordini =

JSON.parse(localStorage.getItem("ordini")) || [];



let area = document.getElementById("tavoli");




for(let i=1;i<=20;i++){


let occupato = ordini.some(function(o){

return o.tavolo == i;

});



let classe = occupato ? "tavolo occupato" : "tavolo";



area.innerHTML +=


`

<div class="${classe}" onclick="apriTavolo(${i})">

🍽️ Tavolo ${i}

<br>

${occupato ? "🔴 Occupato" : "🟢 Libero"}

</div>

`;



}





function apriTavolo(numero){


localStorage.setItem(

"tavoloAttivo",

numero

);



window.location.href="ordine.html";


}





function vaiCassa(){


window.location.href="cassa.html";


}



</script>


</body>

</html>
