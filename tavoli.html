<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Tavoli</title>

<style>

body {
    margin: 0;
    background: #181818;
    color: white;
    font-family: Arial, sans-serif;
}

h1 {
    text-align: center;
    font-size: 40px;
    margin: 25px;
}

h2 {
    margin-left: 25px;
    font-size: 30px;
}


.container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    padding: 25px;
}


.tavolo {
    background: #333;
    border-radius: 20px;
    padding: 25px 10px;
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    border: 3px solid #555;
}


.libero {
    color: #35ff35;
}


.occupato {
    color: #ff4444;
}


.prenotato {
    color: #ffd633;
}


.indietro {
    display: block;
    text-align: center;
    margin: 20px;
    padding: 20px;
    background: #333;
    border-radius: 20px;
    color: white;
    text-decoration: none;
    font-size: 25px;
}


</style>

</head>


<body>


<h1>🍽️ TAVOLI</h1>


<h2>🏠 Sala interna</h2>

<div class="container">

<div class="tavolo libero">Tavolo 1<br>🟢 Libero</div>
<div class="tavolo libero">Tavolo 2<br>🟢 Libero</div>
<div class="tavolo occupato">Tavolo 3<br>🔴 Occupato</div>
<div class="tavolo prenotato">Tavolo 4<br>🟡 Prenotato</div>

</div>



<h2>🌳 Sala esterna</h2>


<div class="container">

<div class="tavolo libero">Esterno 1<br>🟢 Libero</div>
<div class="tavolo libero">Esterno 2<br>🟢 Libero</div>
<div class="tavolo occupato">Esterno 3<br>🔴 Occupato</div>
<div class="tavolo prenotato">Esterno 4<br>🟡 Prenotato</div>

</div>



<a class="indietro" href="index.html">
⬅️ Torna alla cassa
</a>



</body>
</html>
