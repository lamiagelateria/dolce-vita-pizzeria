<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Tavoli</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}

h1{
text-align:center;
font-size:40px;
}

.sezione{
margin:20px;
}

.griglia{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
}

.tavolo{
padding:25px 5px;
border-radius:18px;
text-align:center;
font-size:20px;
font-weight:bold;
background:#197619;
}

.occupato{
background:#8a1616;
}

.prenotato{
background:#8a5a00;
}

.indietro{
display:block;
margin:25px;
padding:20px;
background:#333;
border-radius:20px;
text-align:center;
font-size:25px;
color:white;
text-decoration:none;
}

</style>

</head>


<body>


<h1>🍽️ TAVOLI</h1>


<div class="sezione">

<h2>🏠 Sala interna</h2>

<div class="griglia" id="interni"></div>

</div>



<div class="sezione">

<h2>🌳 Sala esterna</h2>

<div class="griglia" id="esterni"></div>

</div>



<a class="indietro" href="index.html">
⬅️ Torna alla cassa
</a>



<script src="tavoli.js"></script>


<script>


let coperto=0.50;


let stati =
caricaStatoTavoli();



function creaTavolo(numero,sala){


let stato =
stati[numero] || "libero";


let classe="tavolo";


if(stato=="occupato"){

classe+=" occupato";

}


if(stato=="prenotato"){

classe+=" prenotato";

}



return `

<a href="ordine.html?tavolo=${numero}&persone=2&coperto=${coperto}">

<div class="${classe}">

🍽️ ${numero}

<br>

${sala}

<br>

${stato.toUpperCase()}

</div>

</a>

`;

}




let interno="";

let esterno="";



for(let i=1;i<=120;i++){


if(i<=60){

interno += creaTavolo(i,"Sala interna");

}

else{

esterno += creaTavolo(i,"Sala esterna");

}


}



document.getElementById("interni").innerHTML=interno;

document.getElementById("esterni").innerHTML=esterno;



</script>


</body>

</html>
