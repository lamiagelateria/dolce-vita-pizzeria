<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dolce Vita - Tavoli</title>

<style>

body{
margin:0;
background:#181818;
color:white;
font-family:Arial,sans-serif;
}


h1{
text-align:center;
font-size:40px;
}


.sezione{

margin:20px;

}


.griglia{

display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;

}


.tavolo{

padding:25px 5px;
border-radius:18px;
text-align:center;
font-size:22px;
font-weight:bold;
background:#197619;

}


.occupato{

background:#8a1616;

}


.prenotato{

background:#8a5a00;

}



a{

text-decoration:none;
color:white;

}


.indietro{

display:block;
margin:25px;
padding:20px;
background:#333;
border-radius:20px;
text-align:center;
font-size:25px;

}


</style>


</head>


<body>


<h1>🍽️ TAVOLI</h1>


<div class="sezione">


<h2>🏠 Sala interna</h2>


<div class="griglia" id="interni"></div>


</div>




<div class="sezione">


<h2>🌳 Sala esterna</h2>


<div class="griglia" id="esterni"></div>


</div>




<a class="indietro" href="index.html">
⬅️ Torna alla cassa
</a>



<script>


let coperto=0.50;



function creaTavoli(){

let interno="";

let esterno="";



for(let i=1;i<=120;i++){


let sala;


if(i<=60){

sala="Interna";

interno +=

`
<a href="ordine.html?tavolo=${i}&persone=2&coperto=${coperto}">
<div class="tavolo">
🍽️ ${i}
<br>
Sala interna
</div>
</a>
`;

}

else{

esterno +=

`
<a href="ordine.html?tavolo=${i}&persone=2&coperto=${coperto}">
<div class="tavolo">
🍽️ ${i}
<br>
Sala esterna
</div>
</a>
`;

}


}


document.getElementById("interni").innerHTML=interno;

document.getElementById("esterni").innerHTML=esterno;


}


creaTavoli();


</script>


</body>

</html>
