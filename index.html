<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dolce Vita - Gestione Pizzeria</title>

<style>
body {
    margin: 0;
    background: #1e1e1e;
    font-family: Arial, sans-serif;
    color: white;
}

.header {
    text-align: center;
    padding: 25px;
    font-size: 35px;
    font-weight: bold;
}

.subtitle {
    text-align: center;
    font-size: 20px;
    color: #cccccc;
    margin-bottom: 30px;
}

.container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    padding: 20px;
}

.button {
    background: #333333;
    border-radius: 20px;
    padding: 35px 10px;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    border: 2px solid #555;
}

.button:active {
    background: #555;
}

</style>
</head>

<body>

<div class="header">
🍕 DOLCE VITA
</div>

<div class="subtitle">
Gestione Pizzeria
</div>

<div class="container">

<div class="button">🍽️<br>TAVOLI</div>

<div class="button">🛍️<br>ASPORTO</div>

<div class="button">📅<br>PRENOTAZIONI</div>

<div class="button">👨‍🍳<br>CUCINA</div>

<div class="button">💳<br>CASSA</div>

<div class="button">📋<br>ORDINI</div>

<div class="button">🍕<br>MENU</div>

<div class="button">⚙️<br>IMPOSTAZIONI</div>

</div>

</body>
</html>
